<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Napkin: the launcher's icon (tools/BUILD_THE_LAUNCHER.sh). A folded paper napkin on a wooden bench top, with a
       pencil sketch of a board on it, and the pencil that drew it. -->
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9b383"/><stop offset="1" stop-color="#b8875a"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf9f4"/><stop offset="1" stop-color="#ece7dc"/>
    </linearGradient>
    <linearGradient id="flap" x1="1" y1="1" x2="0.4" y2="0.4">
      <stop offset="0" stop-color="#f4f0e6"/><stop offset="1" stop-color="#ddd6c7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#5a3c1e" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#wood)"/>
  <g stroke="#a87a4d" stroke-width="6" fill="none" opacity="0.45">
    <path d="M64 250 C 300 230, 600 280, 960 240"/><path d="M64 520 C 350 500, 650 560, 960 510"/>
    <path d="M64 800 C 320 780, 640 830, 960 790"/>
  </g>
  <g transform="rotate(-6 512 512)" filter="url(#shadow)">
    <path d="M222 222 H802 V662 L662 802 H222 Z" fill="url(#paper)"/>
    <path d="M802 662 L662 802 L700 700 Z" fill="url(#flap)"/>
    <path d="M662 802 L700 700 L802 662" fill="none" stroke="#cfc6b3" stroke-width="4"/>
    <rect x="250" y="250" width="524" height="524" fill="none" stroke="#e2dbcc" stroke-width="5" stroke-dasharray="14 10"/>
    <g fill="none" stroke="#4a4a4f" stroke-linecap="round" stroke-linejoin="round" stroke-width="11">
      <path d="M330 470 L560 352 L700 420 L470 540 Z"/>
      <path d="M330 470 L330 540 L470 612 L700 492 L700 420"/>
      <path d="M470 540 L470 612"/>
    </g>
    <g fill="none" stroke="#4a4a4f" stroke-linecap="round" stroke-width="5" opacity="0.55">
      <path d="M322 466 L566 346"/><path d="M466 548 L706 426"/><path d="M338 545 L474 618"/>
    </g>
    <path d="M300 680 L520 680" stroke="#4a4a4f" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
    <path d="M300 664 L300 696 M520 664 L520 696" stroke="#4a4a4f" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  </g>
  <g transform="rotate(-38 760 720)">
    <rect x="560" y="690" width="380" height="58" rx="8" fill="#f2c230"/>
    <rect x="560" y="690" width="380" height="19" rx="6" fill="#f7d65e"/>
    <rect x="900" y="690" width="52" height="58" fill="#c9c9cf"/>
    <rect x="946" y="690" width="40" height="58" rx="12" fill="#e58a8a"/>
    <path d="M560 690 L500 719 L560 748 Z" fill="#e8c9a0"/>
    <path d="M520 709 L500 719 L520 729 Z" fill="#3c3c40"/>
  </g>
</svg>
