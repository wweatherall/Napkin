<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9eef4"/><stop offset="1" stop-color="#c9d3de"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7c79a"/><stop offset="1" stop-color="#d4a66c"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <!-- grid -->
  <g stroke="#aab6c3" stroke-width="5" opacity="0.7">
    <line x1="150" y1="700" x2="512" y2="880"/><line x1="230" y1="660" x2="592" y2="840"/>
    <line x1="512" y1="880" x2="874" y2="700"/><line x1="432" y1="840" x2="794" y2="660"/>
  </g>
  <!-- axes -->
  <line x1="512" y1="706" x2="512" y2="170" stroke="#2b5ce6" stroke-width="14" stroke-linecap="round"/>
  <line x1="512" y1="706" x2="250" y2="837" stroke="#1f9e3c" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
  <line x1="512" y1="706" x2="774" y2="837" stroke="#d9362b" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
  <!-- the board: top, front and side faces -->
  <polygon points="200,470 512,314 824,470 512,626" fill="url(#top)" stroke="#2b2b2b" stroke-width="12" stroke-linejoin="round"/>
  <polygon points="200,470 512,626 512,706 200,550" fill="#b98a55" stroke="#2b2b2b" stroke-width="12" stroke-linejoin="round"/>
  <polygon points="512,626 824,470 824,550 512,706" fill="#a67646" stroke="#2b2b2b" stroke-width="12" stroke-linejoin="round"/>
  <!-- a through-hole -->
  <polygon points="566,440 646,400 726,440 646,480" fill="#5a3d22" stroke="#2b2b2b" stroke-width="10" stroke-linejoin="round"/>
</svg>
