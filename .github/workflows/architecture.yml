name: Architecture review
on: [pull_request]
permissions:
  contents: read
jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test architecture guard
        run: python3 tools/test_check_architecture.py
      - name: Check architecture impact
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/check_architecture.py --range "$BASE..$HEAD"
